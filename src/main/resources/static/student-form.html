<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông tin sinh viên</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h3 id="formTitle" class="mb-4">Thêm sinh viên mới</h3>
        <div class="card">
            <div class="card-body">
                <form id="studentForm">
                    <!-- Ẩn ID để dùng lúc cập nhật -->
                    <input type="hidden" id="studentId">
                    
                    <div class="mb-3">
                        <label class="form-label">Mã sinh viên</label>
                        <input type="text" class="form-control" id="studentCode" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Họ và tên</label>
                        <input type="text" class="form-control" id="fullName" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Số điện thoại</label>
                        <input type="text" class="form-control" id="phone">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Lớp</label>
                        <input type="text" class="form-control" id="className">
                    </div>
                    
                    <div class="mt-4">
                        <button type="submit" class="btn btn-success" id="btnSave">Lưu thông tin</button>
                        <a href="student.html" class="btn btn-secondary">Quay lại</a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="./assets/js/student-form.js"></script>
</body>
</html>
